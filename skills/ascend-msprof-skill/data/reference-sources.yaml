  msprof_op:
    title: CANN msprof op and simulator documentation
    url: https://www.hiascend.com/document/detail/en/canncommercial/800/devaids/optool/atlasopdev_16_00851.html
    notes: Operator-level onboard and simulator profiling outputs.
  profiling_quick_start:

    notes: Application-level PROF output files and timeline artifacts.
  msprof_timeline_cann900beta1:
    title: CANN Community Edition 9.0.0-beta.1 msprof timeline reference
    url: https://www.hiascend.com/document/detail/zh/CANNCommunityEdition/900beta1/devaids/Profiling/atlasprofiling_16_0059.html
    notes: Source for msprof_*.json as application timeline summary context and visualization layers; newer than the historical CANN 8.3.RC2 Ascend 910B2 fixture set and not a stable parser schema.
  msprof_timeline_ascendcl82rc1:
    title: CANN Community Edition 8.2.RC1 AscendCL performance tuning msprof timeline guidance

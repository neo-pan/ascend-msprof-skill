application_level:
  op_summary:
    patterns: ["op_summary_*.csv"]
    questions:
      - Which operators dominate elapsed time?
      - How many times does each operator run?
  op_statistic:
    patterns: ["op_statistic_*.csv"]
    questions:
      - Which operator types dominate aggregate runtime?
  task_time:
    patterns: ["task_time_*.csv"]
    questions:
      - Which device tasks dominate runtime?
  api_statistic:
    patterns: ["api_statistic_*.csv"]
    questions:
      - Is host/runtime API overhead relevant?
  timeline:
    patterns: ["msprof_*.json"]
    questions:
      - How do host API, runtime, stream tasks, and operators overlap?

operator_level:
  op_basic_info:
    patterns: ["OpBasicInfo.csv"]
    questions:
      - Which op/kernel, shape, blockDim, and execution metadata were profiled?
  pipe_utilization:
    patterns: ["PipeUtilization.csv"]
    questions:
      - Which AI Core pipe limits execution?
  arithmetic_utilization:
    patterns: ["ArithmeticUtilization.csv"]
    questions:
      - How much arithmetic capability is used?
  l2_cache:
    patterns: ["L2Cache.csv"]
    questions:
      - What L2 cache hit-rate fields are present for profiled AI Core sub-blocks?
  memory:
    patterns: ["Memory.csv", "MemoryL0.csv", "MemoryUB.csv"]
    questions:
      - Which memory level or transfer path is hot?
  resource_conflict:
    patterns: ["ResourceConflictRatio.csv"]
    questions:
      - Are resource conflicts or bank conflicts significant?

simulator:
  code_execution:
    patterns: ["core*_code_exe.csv"]
    questions:
      - Which source lines dominate simulated execution time?
  instruction_execution:
    patterns: ["core*_instr_exe.csv"]
    questions:
      - Which instructions dominate simulated execution time?
  trace:
    patterns: ["trace.json"]
    questions:
      - What simulator pipeline context is visible for instruction timing and flow?

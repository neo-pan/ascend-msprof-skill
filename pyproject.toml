[build-system]
requires = ["hatchling>=1.9"]
build-backend = "hatchling.build"

[project]
name = "ascend-msprof-skill"
version = "0.1.0"
description = "Ascend msprof profiling helpers and Codex skill resources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.13.5,<3",
]

[project.scripts]
ascend-msprof = "ascend_msprof_skill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ascend_msprof_skill"]

[tool.hatch.build.targets.wheel.force-include]
"skills/ascend-msprof-skill" = "ascend_msprof_skill/skill"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "skills/ascend-msprof-skill/",
    "README.md",
    "requirements.txt",
    "requirements-dev.txt",
    "pyproject.toml",
    "scripts/check_dist_contents.py",
]
exclude = [
    ".codex/",
    ".claude/",
    ".humanize/",
    "downloads/",
    "local-notes/",
    "profile/",
    "tests/",
    "tmp-downloads/",
    "PROF_*/",
    "OPPROF_*/",
]

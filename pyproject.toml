[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-msprof-skill"
version = "0.1.0"
description = "Ascend msprof profiling helpers and Codex skill resources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
ascend-msprof = "ascend_msprof_skill.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
ascend_msprof_skill = [
    "skill/SKILL.md",
    "skill/ascend-910b-programming.md",
    "skill/reference/*.md",
    "skill/data/*.yaml",
    "skill/assets/*",
]
